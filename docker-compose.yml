name: regwatch
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  minio:
    image: regwatch-minio:local
    build: ./ops/minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data:/data
    restart: unless-stopped
  bucket-init:
    image: regwatch-minio:local
    build: ./ops/minio
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      SNAPSHOT_BUCKET: ${SNAPSHOT_BUCKET:?set SNAPSHOT_BUCKET in .env}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        attempt=0
        until timeout 10s mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" && timeout 10s mc mb --ignore-existing "local/$${SNAPSHOT_BUCKET}"; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 12 ]; then exit 1; fi
          sleep 2
        done
  migrate:
    build: ./backend
    restart: on-failure:3
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      CRAWL_CONTACT_EMAIL: ${CRAWL_CONTACT_EMAIL:-contact@example.invalid}
      CRAWL_TIMEOUT_S: ${CRAWL_TIMEOUT_S:-15}
      CRAWL_TOTAL_TIMEOUT_S: ${CRAWL_TOTAL_TIMEOUT_S:-60}
      CRAWL_DELAY_S: ${CRAWL_DELAY_S:-2}
      CRAWL_MAX_RETRIES: ${CRAWL_MAX_RETRIES:-2}
      CRAWL_BACKOFF_S: ${CRAWL_BACKOFF_S:-1}
      CRAWL_RETRY_AFTER_CAP_S: ${CRAWL_RETRY_AFTER_CAP_S:-60}
      CRAWL_MAX_REDIRECTS: ${CRAWL_MAX_REDIRECTS:-5}
      CRAWL_MAX_RESPONSE_BYTES: ${CRAWL_MAX_RESPONSE_BYTES:-10485760}
      ROBOTS_CACHE_TTL_S: ${ROBOTS_CACHE_TTL_S:-3600}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_TIMEOUT_S: ${REDIS_TIMEOUT_S:-2}
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-50}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-regwatch}
      RATE_INTERVAL_S: ${RATE_INTERVAL_S:-5}
      RATE_CAPACITY: ${RATE_CAPACITY:-1}
      DOMAIN_CONCURRENCY: ${DOMAIN_CONCURRENCY:-1}
      COORDINATION_WAIT_S: ${COORDINATION_WAIT_S:-120}
      ROBOTS_REFRESH_LEASE_S: ${ROBOTS_REFRESH_LEASE_S:-30}
      LEASE_DURATION_S: ${LEASE_DURATION_S:-60}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      SNAPSHOT_BUCKET: ${SNAPSHOT_BUCKET}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_CONNECT_TIMEOUT_S: ${S3_CONNECT_TIMEOUT_S:-3}
      S3_READ_TIMEOUT_S: ${S3_READ_TIMEOUT_S:-10}
      S3_MAX_ATTEMPTS: ${S3_MAX_ATTEMPTS:-3}
    depends_on:
      postgres:
        condition: service_healthy
    command: [alembic, upgrade, head]
  api:
    build: ./backend
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000']
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  minio_data:
