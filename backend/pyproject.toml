[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "regwatch-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["SQLAlchemy==2.0.36", "alembic==1.14.0", "psycopg[binary]==3.2.3", "pydantic-settings==2.6.1", "defusedxml==0.7.1", "httpx==0.28.1", "protego==0.4.0", "boto3==1.35.99", "fastapi==0.115.6", "uvicorn==0.34.0"]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.4", "mypy==1.13.0", "pytest-asyncio==0.25.3", "boto3-stubs[s3]==1.35.99"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
